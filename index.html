<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-display">
            <input class="display"  readonly/>
        </div>
        <div class="calculator-btn-row1">
            <button class="colorGray" id="clear">AC</button>
            <button class="colorGray" id="delete">DEL</button>
            <button class="colorGray" id="percent">%</button>
            <button class="colorGold" id="divide">÷</button>
        </div>
        <div class="calculator-btn-row2">
            <button class="colorDarkGrey" id="seven">7</button>
            <button class="colorDarkGrey" id="eight">8</button>
            <button class="colorDarkGrey" id="nine">9</button>
            <button class="colorGold" id="multiply">x</button>
        </div>
        <div class="calculator-btn-row3">
            <button class="colorDarkGrey" id="four">4</button>
            <button class="colorDarkGrey" id="five">5</button>
            <button class="colorDarkGrey" id="six">6</button>
            <button class="colorGold" id="minus">-</button>
        </div>
        <div class="calculator-btn-row4">
            <button class="colorDarkGrey" id="one">1</button>
            <button class="colorDarkGrey" id="two">2</button>
            <button class="colorDarkGrey" id="three">3</button>
            <button class="colorGold" id="plus">+</button>
        </div>
        <div class="calculator-btn-row5">
            <button class="zeroBtn" id="zero">0</button>
            <button class="colorDarkGrey" id="dot">.</button>
            <button class="colorGold" id="equal-to">=</button>
        </div>
        
    </div>







    <script src="calculator.js" defer>

    </script>
</body>
</html>
